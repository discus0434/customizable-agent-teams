team:
  name: customizable-agent-teams
  session: agent-team
  lead:
    id: lead
    role: lead
    cli: claude
    model: claude-opus-4-8
    window: lead
    command: claude --dangerously-skip-permissions --model claude-opus-4-8 --effort max
  workers:
    - id: worker-1
      role: worker
      cli: codex
      model: gpt-5.5
      window: worker-1
      command: codex --dangerously-bypass-approvals-and-sandbox --model gpt-5.5
    - id: worker-2
      role: worker
      cli: codex
      model: gpt-5.5
      window: worker-2
      command: codex --dangerously-bypass-approvals-and-sandbox --model gpt-5.5
    - id: worker-3
      role: worker
      cli: codex
      model: gpt-5.5
      window: worker-3
      command: codex --dangerously-bypass-approvals-and-sandbox --model gpt-5.5
  review:
    cli: claude
    model: claude-opus-4-8
    effort: medium
    timeout_seconds: 180
    output_dir: .agents/queue/reviews
