team:
  name: customizable-agent-teams
  session: agent-team
  lead:
    id: lead
    role: lead
    cli: claude
    model: claude-opus-4-8
    window: lead
    command: claude --dangerously-skip-permissions --model claude-opus-4-8 --effort max
  manager:
    id: manager
    role: manager
    cli: claude
    model: claude-opus-4-8
    window: manager
    command: claude --dangerously-skip-permissions --model claude-opus-4-8 --effort max
  strategist:
    id: strategist
    role: strategist
    cli: claude
    model: claude-opus-4-8
    window: strategist
    command: claude --dangerously-skip-permissions --model claude-opus-4-8 --effort max
  reviewers:
    - id: reviewer-1
      role: reviewer
      cli: claude
      model: claude-opus-4-8
      window: reviewer-1
      command: claude --dangerously-skip-permissions --model claude-opus-4-8 --effort high
    - id: reviewer-2
      role: reviewer
      cli: claude
      model: claude-opus-4-8
      window: reviewer-2
      command: claude --dangerously-skip-permissions --model claude-opus-4-8 --effort high
  workers:
    - id: worker-1
      role: worker
      cli: codex
      model: gpt-5.5
      window: worker-1
      command: codex --dangerously-bypass-approvals-and-sandbox --model gpt-5.5
    - id: worker-2
      role: worker
      cli: codex
      model: gpt-5.5
      window: worker-2
      command: codex --dangerously-bypass-approvals-and-sandbox --model gpt-5.5
    - id: worker-3
      role: worker
      cli: codex
      model: gpt-5.5
      window: worker-3
      command: codex --dangerously-bypass-approvals-and-sandbox --model gpt-5.5
